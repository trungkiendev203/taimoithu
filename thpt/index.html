<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Điểm Thi THPT Quốc Gia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #312e81 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #1e1b4b 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.2);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            color: #94a3b8;
            margin: 20px 0;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .result-container {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .result-container.active {
            display: block;
        }

        .student-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid var(--card-border);
        }

        .student-info h2 {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .total-score {
            font-size: 28px;
            font-weight: 700;
            color: #10b981;
        }

        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .score-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .score-card:hover {
            transform: translateY(-2px);
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .subject {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .score {
            font-size: 20px;
            font-weight: 600;
            color: #f8fafc;
        }

        .score.empty {
            color: #475569;
        }

        .error {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tra Điểm THPT Quốc Gia</h1>
        <p class="subtitle">Dữ liệu lấy trực tiếp từ hệ thống, nhanh chóng & chính xác</p>

        <div class="input-group">
            <input type="text" id="sbdInput" placeholder="Nhập số báo danh (VD: 34000001)" autocomplete="off">
            <button onclick="searchScore()">Tra Cứu</button>
        </div>

        <div class="loading" id="loadingText">Đang tìm kiếm dữ liệu...</div>
        <div class="error" id="errorBox">Không tìm thấy dữ liệu cho số báo danh này.</div>

        <div class="result-container" id="resultContainer">
            <div class="student-info">
                <h2>Số báo danh: <span id="rsSbd" style="color: white"></span></h2>
                <div>Tổng điểm khối xét tuyển chính: <span class="total-score" id="rsTotal"></span></div>
            </div>

            <div class="scores-grid" id="scoresGrid">
                <!-- Scores will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const subjectMap = {
            'TOAN': 'Toán học',
            'VAN': 'Ngữ Văn',
            'NGOAI_NGU': 'Ngoại Ngữ',
            'LI': 'Vật Lý',
            'HOA': 'Hóa Học',
            'SINH': 'Sinh Học',
            'SU': 'Lịch Sử',
            'DIA': 'Địa Lý',
            'GIAO_DUC_CONG_DAN': 'GDCD'
        };

        async function searchScore() {
            const sbd = document.getElementById('sbdInput').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const errorBox = document.getElementById('errorBox');
            const loadingText = document.getElementById('loadingText');

            if (!sbd) return;

            // Reset UI
            resultContainer.classList.remove('active');
            errorBox.style.display = 'none';
            loadingText.style.display = 'block';

            try {
                // Fetch direct API with param year=2025
                const response = await fetch(`https://s6.tuoitre.vn/api/diem-thi-thpt.htm?sbd=${sbd}&year=2026`);
                const data = await response.json();

                loadingText.style.display = 'none';

                if (data.success && data.data && data.data.length > 0) {
                    const info = data.data[0];
                    displayResult(info);
                } else {
                    errorBox.style.display = 'block';
                }
            } catch (error) {
                loadingText.style.display = 'none';
                errorBox.textContent = "Có lỗi xảy ra khi kết nối đến máy chủ. Vui lòng thử lại sau.";
                errorBox.style.display = 'block';
            }
        }

        function displayResult(data) {
            document.getElementById('rsSbd').textContent = data.SBD;
            document.getElementById('rsTotal').textContent = data.TONGDIEM > 0 ? data.TONGDIEM : 'N/A';

            const grid = document.getElementById('scoresGrid');
            grid.innerHTML = '';

            for (const [key, name] of Object.entries(subjectMap)) {
                const scoreValue = data[key];
                // Check if subject was taken (usually -1 if not taken)
                const isTaken = scoreValue !== undefined && scoreValue !== -1 && scoreValue !== "";
                const displayScore = isTaken ? scoreValue : '-';
                const emptyClass = !isTaken ? 'empty' : '';

                const card = document.createElement('div');
                card.className = 'score-card';
                card.innerHTML = `
                    <div class="subject">${name}</div>
                    <div class="score ${emptyClass}">${displayScore}</div>
                `;
                grid.appendChild(card);
            }

            document.getElementById('resultContainer').classList.add('active');
        }

        // Allow Enter key to submit
        document.getElementById('sbdInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchScore();
            }
        });
    </script>
</body>
</html>
